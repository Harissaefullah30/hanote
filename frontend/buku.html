    <style>
        /* ============================================
           BUKU TERBUKA - KREM & COKLAT
           ============================================ */

        body.buku-body {
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 50%, #d4a373 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buku-container {
            max-width: 900px;
            width: 100%;
        }

        /* TOMBOL KEMBALI */
        .buku-btn-back {
            display: inline-block;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #d4a373;
            color: #8b5a2b;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.2);
        }

        .buku-btn-back:hover {
            background: #d4a373;
            color: white;
            transform: translateY(-2px);
        }

        /* JUDUL BUKU */
        .buku-judul {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            color: #8b5a2b;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        /* BUKU TERBUKA */
        .buku-terbuka {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: linear-gradient(135deg, #fff8f0 0%, #f5e6d3 100%);
            border-radius: 10px;
            box-shadow: 
                0 20px 60px rgba(139, 90, 43, 0.4),
                inset 0 0 60px rgba(212, 163, 115, 0.1);
            border: 6px solid #8b5a2b;
            position: relative;
            min-height: 480px;
            overflow: hidden;
        }

        /* GARIS TENGAH BUKU */
        .buku-terbuka::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, 
                #8b5a2b 0%, 
                #d4a373 20%, 
                #8b5a2b 50%, 
                #d4a373 80%, 
                #8b5a2b 100%);
            box-shadow: 
                -2px 0 6px rgba(0, 0, 0, 0.2),
                2px 0 6px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* HALAMAN KIRI */
        .buku-halaman-kiri {
            padding: 30px 28px;
            border-right: 1px solid rgba(139, 90, 43, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* HALAMAN KANAN */
        .buku-halaman-kanan {
            padding: 30px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* NOMOR HALAMAN */
        .buku-halaman-num {
            position: absolute;
            bottom: 14px;
            font-size: 12px;
            color: #a67c52;
            font-style: italic;
            font-family: Georgia, serif;
        }

        .buku-halaman-kiri .buku-halaman-num {
            left: 28px;
        }

        .buku-halaman-kanan .buku-halaman-num {
            right: 28px;
        }

        /* JUDUL HALAMAN */
        .buku-halaman-judul {
            font-size: 14px;
            font-weight: 800;
            color: #8b5a2b;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-align: center;
            font-family: Georgia, serif;
            border-bottom: 1px dashed #d4a373;
            padding-bottom: 10px;
        }

        /* ISI BACAAN (KIRI) */
        .buku-isi-bacaan {
            font-size: 16px;
            color: #6b4423;
            line-height: 1.8;
            text-align: center;
            font-family: Georgia, serif;
            font-style: italic;
            padding: 20px 10px;
        }

        .buku-isi-bacaan .quote-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 12px;
            color: #d4a373;
        }

        /* HALAMAN KANAN - CATATAN */
        .buku-catatan-label {
            font-size: 12px;
            font-weight: 800;
            color: #8b5a2b;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .buku-catatan-input {
            width: 100%;
            min-height: 280px;
            padding: 14px;
            border: 2px dashed #d4a373;
            border-radius: 12px;
            font-size: 14px;
            font-family: Georgia, serif;
            color: #6b4423;
            background: rgba(255, 255, 255, 0.6);
            resize: vertical;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .buku-catatan-input:focus {
            outline: none;
            border-color: #8b5a2b;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
        }

        .buku-catatan-input::placeholder {
            color: #b59579;
            font-style: italic;
        }

        /* STATUS SIMPAN */
        .buku-status {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            font-weight: 700;
            color: #43e97b;
            font-style: italic;
        }

        /* NAVIGASI */
        .buku-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 12px;
        }

        .buku-nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #d4a373 0%, #8b5a2b 100%);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.3);
        }

        .buku-nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 90, 43, 0.5);
        }

        .buku-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .buku-nav-info {
            font-size: 14px;
            font-weight: 800;
            color: #8b5a2b;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #d4a373;
        }

        /* TOMBOL SIMPAN */
        .buku-btn-simpan {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(67, 233, 123, 0.3);
        }

        .buku-btn-simpan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 233, 123, 0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            body.buku-body {
                padding: 12px;
                align-items: flex-start;
            }

            .buku-judul {
                font-size: 18px;
                letter-spacing: 1px;
                margin-bottom: 14px;
            }

            .buku-terbuka {
                grid-template-columns: 1fr;
                min-height: auto;
                border-width: 4px;
            }

            .buku-terbuka::before {
                display: none;
            }

            .buku-halaman-kiri {
                border-right: none;
                border-bottom: 2px solid rgba(139, 90, 43, 0.2);
                padding: 20px 18px;
            }

            .buku-halaman-kanan {
                padding: 20px 18px;
            }

            .buku-isi-bacaan {
                font-size: 14px;
                padding: 10px 4px;
            }

            .buku-catatan-input {
                min-height: 180px;
                font-size: 13px;
            }

            .buku-nav {
                flex-wrap: wrap;
            }

            .buku-nav-btn {
                padding: 10px 16px;
                font-size: 12px;
                flex: 1;
            }

            .buku-nav-info {
                padding: 8px 14px;
                font-size: 12px;
                order: -1;
                width: 100%;
                text-align: center;
            }

            .buku-halaman-num {
                position: static;
                text-align: center;
                margin-top: 12px;
            }
        }
    </style>
</head>

            },
            rahasia: {
                judul: '🔒 BUKU RAHASIA',
                warna: '#c084fc',
                halaman: [
                    '🔒 "Aku suka cara kamu menatapku saat aku tidak lihat."',

                ]
            }
        };

        // ============================================
        // VARIABEL
        // ============================================

        let jenisBuku = 'cinta';
        let halamanSekarang = 0;
        let dataBukuAktif = null;
        let totalHalaman = 20;

        // ============================================
        // AMBIL JENIS BUKU DARI URL
        // ============================================

        function ambilJenisBuku() {
            const urlParams = new URLSearchParams(window.location.search);
            const jenis = urlParams.get('jenis');
            if (jenis && dataBuku[jenis]) {
                jenisBuku = jenis;
            }
            dataBukuAktif = dataBuku[jenisBuku];
            totalHalaman = dataBukuAktif.halaman.length;
        }

        // ============================================
        // NAVIGASI
        // ============================================

        function kembaliKeRuangBelajar() {
            window.location.href = 'ruang-belajar.html';
        }

        function halamanSebelum() {
            if (halamanSekarang > 0) {
                halamanSekarang--;
                tampilkanHalaman();
            }
        }

        function halamanBerikut() {
            if (halamanSekarang < totalHalaman - 1) {
                halamanSekarang++;
                tampilkanHalaman();
            }
        }

        // ============================================
        // TAMPILKAN HALAMAN
        // ============================================

        function tampilkanHalaman() {
            // Update judul
            document.getElementById('bukuJudul').textContent = dataBukuAktif.judul;

            // Update isi bacaan
            const isi = dataBukuAktif.halaman[halamanSekarang];
            document.getElementById('bukuIsiBacaan').innerHTML = 
                '<span class="quote-icon">❝</span>' + isi;

            // Update nomor halaman
            document.getElementById('nomorKiri').textContent = '- ' + (halamanSekarang * 2 + 1) + ' -';
            document.getElementById('nomorKanan').textContent = '- ' + (halamanSekarang * 2 + 2) + ' -';

            // Update info halaman
            document.getElementById('infoHalaman').textContent = 
                '📄 ' + (halamanSekarang + 1) + ' / ' + totalHalaman;

            // Update tombol
            document.getElementById('btnSebelum').disabled = (halamanSekarang === 0);
            document.getElementById('btnBerikut').disabled = (halamanSekarang === totalHalaman - 1);

            // Load catatan
            loadCatatan();
        }

        // ============================================
        // CATATAN
        // ============================================

        function getKeyCatatan() {
            return 'catatanBuku_' + jenisBuku + '_hal' + halamanSekarang;
        }

        function loadCatatan() {
            const catatan = localStorage.getItem(getKeyCatatan()) || '';
            document.getElementById('catatanInput').value = catatan;
            document.getElementById('statusSimpan').textContent = '';
        }

        function simpanCatatan() {
            const catatan = document.getElementById('catatanInput').value;
            localStorage.setItem(getKeyCatatan(), catatan);
            
            const status = document.getElementById('statusSimpan');
            status.textContent = '✅ Catatan tersimpan!';
            
            setTimeout(() => {
                status.textContent = '';
            }, 2000);
        }

        // Auto-save saat menulis (setiap 1 detik)
        let autoSaveTimer = null;
        document.getElementById('catatanInput').addEventListener('input', function() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                localStorage.setItem(getKeyCatatan(), this.value);
            }, 1000);
        });

        // ============================================
        // ANIMASI HATI
        // ============================================

        function buatHati() {
            const container = document.getElementById('hatiContainer');
            if (!container) return;
            const hati = document.createElement('div');
            hati.className = 'hati-jatuh';
            const icons = ['❤️', '📖', '✨', '💌'];
            hati.textContent = icons[Math.floor(Math.random() * icons.length)];
            hati.style.left = Math.random() * 100 + '%';
            hati.style.fontSize = (Math.random() * 20 + 16) + 'px';
            hati.style.animationDuration = (Math.random() * 3 + 2) + 's';
            hati.style.opacity = Math.random() * 0.5 + 0.5;
            container.appendChild(hati);
            setTimeout(() => hati.remove(), 5000);
        }
        setInterval(buatHati, 700);

        // ============================================
        // KEYBOARD NAVIGASI
        // ============================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') halamanSebelum();
            if (e.key === 'ArrowRight') halamanBerikut();
        });

        // ============================================
        // INISIALISASI
        // ============================================

        window.addEventListener('load', function() {
            ambilJenisBuku();
            tampilkanHalaman();
        });
    </script>

</body>
</html>
