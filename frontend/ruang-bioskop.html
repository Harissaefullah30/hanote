<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Ruang Bioskop - HarisAnita Cinema</title>
    
        <link rel="stylesheet" href="style.css">
    <style>
        /* ============================================
           RUANG BIOSKOP - NUANSA GELAP & ROMANTIS
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.ruang-bioskop-body {
            background: radial-gradient(ellipse at center top, #1a0a0a 0%, #0a0505 50%, #000000 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* LAMPU SOROT ATAS */
        .lampu-sorot-atas {
            position: fixed;
            top: -50px;
            left: 20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 235, 150, 0.15) 0%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: sorotGoyang 6s ease-in-out infinite;
        }

        .lampu-sorot-2 {
            left: 60%;
            animation-delay: 2s;
        }

        @keyframes sorotGoyang {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(30px) scale(1.1); }
        }

        .rbioskop-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* HEADER INFO */
        .rbioskop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.6) 0%, rgba(60, 20, 20, 0.6) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(212, 175, 55, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .rbioskop-info-kiri,
        .rbioskop-info-kanan {
            flex-shrink: 0;
        }

        .rbioskop-info-tengah {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .rbioskop-live {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, #ff0000, #8b0000);
            color: white;
            font-size: 12px;
            font-weight: 800;
            border-radius: 20px;
            letter-spacing: 1px;
            animation: pulseLive 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .rbioskop-info-tengah h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #d4af37 0%, #f5c542 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        .rbioskop-timer {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: #d4af37;
            font-size: 14px;
            font-weight: 800;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* LAYAR BIOSKOP */
        .rbioskop-layar-area {
            position: relative;
            margin-bottom: 24px;
            padding: 20px 0;
        }

        .rbioskop-layar-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        .rbioskop-layar-frame {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px;
            background: linear-gradient(135deg, #2a1a0a 0%, #1a0a0a 100%);
            border-radius: 16px;
            border: 4px solid #d4af37;
            box-shadow: 
                0 0 60px rgba(212, 175, 55, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .rbioskop-layar-frame::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            border-radius: 2px;
        }

        .rbioskop-layar-emboss {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
        }

        .rbioskop-layar-emboss iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .rbioskop-cahaya-layar {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: radial-gradient(ellipse at center top, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            filter: blur(30px);
            pointer-events: none;
            z-index: 0;
        }

        /* INFO BAR */
        .rbioskop-info-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 14px;
            background: linear-gradient(135deg, rgba(30, 20, 10, 0.8), rgba(20, 10, 5, 0.8));
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .rbioskop-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            border-right: 1px solid rgba(212, 175, 55, 0.2);
        }

        .rbioskop-info-item:last-child {
            border-right: none;
        }

        .info-label {
            font-size: 11px;
            color: rgba(212, 175, 55, 0.7);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .info-nilai {
            font-size: 13px;
            color: #f5c542;
            font-weight: 800;
            text-align: center;
            word-break: break-word;
        }

        /* KURSI BIOSKOP */
        .rbioskop-kursi-area {
            padding: 24px 20px;
            background: linear-gradient(135deg, rgba(30, 20, 10, 0.8), rgba(20, 10, 5, 0.8));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .rbioskop-kursi-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .rbioskop-kursi-label {
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #d4af37;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            position: relative;
        }

        .rbioskop-kursi-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            max-width: 700px;
            margin: 0 auto 16px;
            position: relative;
        }

        .kursi-bioskop {
            aspect-ratio: 1/1;
            background: linear-gradient(135deg, #3a1a1a 0%, #1a0a0a 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s;
            position: relative;
            cursor: default;
        }

        .kursi-bioskop.kursi-saya {
            background: linear-gradient(135deg, #d4af37 0%, #f5c542 100%);
            border-color: #ffeb96;
            box-shadow: 
                0 0 20px rgba(212, 175, 55, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: kursiGlow 2s ease-in-out infinite;
            transform: scale(1.05);
        }

        @keyframes kursiGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 35px rgba(212, 175, 55, 1), inset 0 0 15px rgba(255, 255, 255, 0.5); }
        }

        .rbioskop-kursi-keterangan {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 12px;
            color: rgba(212, 175, 55, 0.7);
            font-weight: 700;
            flex-wrap: wrap;
        }

        /* TOMBOL KELUAR */
        .rbioskop-tombol-area {
            text-align: center;
            padding: 10px;
        }

        .rbioskop-btn-keluar {
            padding: 14px 36px;
            background: linear-gradient(135deg, #8b0000 0%, #d4af37 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(139, 0, 0, 0.5);
            font-family: inherit;
        }

        .rbioskop-btn-keluar:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.6);
        }

        /* CHAT MABAR */
        .chat-mabar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            background: linear-gradient(135deg, rgba(30, 20, 10, 0.95), rgba(20, 10, 5, 0.95));
            backdrop-filter: blur(10px);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 16px;
            z-index: 100;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, #8b0000, #5a0000);
            color: white;
            font-weight: 800;
            font-size: 13px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.5);
        }

        .chat-header button {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 0 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            max-height: 280px;
        }

        .chat-welcome {
            text-align: center;
            color: rgba(212, 175, 55, 0.7);
            font-size: 12px;
            font-style: italic;
            padding: 8px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 13px;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .chat-input-area button {
            padding: 8px 14px;
            margin-left: 8px;
            background: linear-gradient(135deg, #d4af37, #f5c542);
            color: #1a0a0a;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-input-area button:hover {
            transform: scale(1.05);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .rbioskop-kursi-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        @media (max-width: 600px) {
            body.ruang-bioskop-body {
                padding: 10px;
            }

            .rbioskop-header {
                padding: 10px 12px;
            }

            .rbioskop-info-tengah h1 {
                font-size: 13px;
                letter-spacing: 0.5px;
            }

            .rbioskop-live,
            .rbioskop-timer {
                font-size: 10px;
                padding: 4px 10px;
            }

            .rbioskop-layar-frame {
                padding: 6px;
                border-width: 2px;
            }

            .rbioskop-info-bar {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
                gap: 6px;
            }

            .rbioskop-info-item {
                padding: 6px;
                border-right: none;
            }

            .info-label {
                font-size: 10px;
            }

            .info-nilai {
                font-size: 11px;
            }

            .rbioskop-kursi-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            .kursi-bioskop {
                font-size: 16px;
            }

            .rbioskop-btn-keluar {
                padding: 12px 24px;
                font-size: 13px;
            }

            .chat-mabar {
                width: calc(100% - 20px);
                right: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body class="ruang-bioskop-body">

    <div id="hatiContainer"></div>

    <!-- LAMPU SOROT ATAS -->
    <div class="lampu-sorot-atas"></div>
    <div class="lampu-sorot-atas lampu-sorot-2"></div>

    <div class="rbioskop-wrapper">

        <!-- HEADER INFO BIOSKOP -->
        <div class="rbioskop-header">
            <div class="rbioskop-info-kiri">
                <span class="rbioskop-live">🔴 LIVE</span>
            </div>
            <div class="rbioskop-info-tengah">
                <h1 id="judulFilmHeader">🎬 Memuat...</h1>
            </div>
            <div class="rbioskop-info-kanan">
                <span id="timerNonton" class="rbioskop-timer">⏱️ --:--:--</span>
            </div>
        </div>

        <!-- LAYAR BIOSKOP BESAR -->
        <div class="rbioskop-layar-area">
            <div class="rbioskop-layar-frame">
                <div class="rbioskop-layar-emboss">
                    <iframe 
                        id="layarYT"
                        src=""
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                    ></iframe>
                </div>
                <div class="rbioskop-cahaya-layar"></div>
            </div>
        </div>

        <!-- INFO TIKET & SNACK -->
        <div class="rbioskop-info-bar">
            <div class="rbioskop-info-item">
                <span class="info-label">🎫 Tiket</span>
                <span class="info-nilai" id="infoTiket">-</span>
            </div>
            <div class="rbioskop-info-item">
                <span class="info-label">🪑 Kursi</span>
                <span class="info-nilai" id="infoKursi">-</span>
            </div>
            <div class="rbioskop-info-item">
                <span class="info-label">🍿 Snack</span>
                <span class="info-nilai" id="infoSnack">-</span>
            </div>
            <div class="rbioskop-info-item">
                <span class="info-label">📅 Tanggal</span>
                <span class="info-nilai" id="infoTanggal">-</span>
            </div>
        </div>

        <!-- KURSI BIOSKOP -->
        <div class="rbioskop-kursi-area">
            <div class="rbioskop-kursi-label">🪑 KURSI PENONTON</div>
            <div class="rbioskop-kursi-grid">
                <!-- Kursi akan di-generate oleh JS -->
            </div>
            <div class="rbioskop-kursi-keterangan">
                <span>💛 Kursi Anda</span>
                <span>💺 Kursi Kosong</span>
            </div>
        </div>

        <!-- TOMBOL KELUAR -->
        <div class="rbioskop-tombol-area">
            <button class="rbioskop-btn-keluar" onclick="keluarBioskop()">🚪 Keluar Bioskop</button>
        </div>

    </div>

    <!-- CHAT MABAR (Untuk mode berdua) -->
    <div class="chat-mabar" id="chatMabar" style="display: none;">
        <div class="chat-header">
            <span>💬 Chat Berdua</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-welcome">💕 Selamat nonton berdua!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ketik pesan..." />
            <button onclick="kirimChat()">➤</button>
        </div>
    </div>

        <script src="script.js"></script>
    <script>
        // ============================================
        // RUANG BIOSKOP - LOGIC
        // ============================================

        const ruangan = localStorage.getItem('ruanganHanote') || 'Ruangan';

        // ============================================
        // AMBIL DATA TIKET
        // ============================================

        function ambilTiket() {
            const tiketStr = localStorage.getItem('tiketBioskop');
            if (!tiketStr) {
                alert('⚠️ Tiket tidak ditemukan! Silakan beli tiket dulu.');
                window.location.href = 'bioskop.html';
                return null;
            }
            return JSON.parse(tiketStr);
        }

        // ============================================
        // KONVERSI LINK YOUTUBE KE EMBED
        // ============================================

        function getYoutubeEmbed(url) {
            // Format yang didukung:
            // 1. https://www.youtube.com/watch?v=VIDEO_ID
            // 2. https://youtu.be/VIDEO_ID
            // 3. https://www.youtube.com/embed/VIDEO_ID
            // 4. VIDEO_ID langsung

            let videoId = '';

            if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(url.split('?')[1]);
                videoId = urlParams.get('v');
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('youtube.com/embed/')[1].split('?')[0];
            } else {
                // Anggap sebagai video ID
                videoId = url;
            }

            return 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1';
        }

        // ============================================
        // SETUP LAYAR BIOSKOP
        // ============================================

                function setupLayar(tiket) {
            const embedUrl = getYoutubeEmbed(tiket.linkYT);
            const iframe = document.getElementById('layarYT');
            iframe.src = embedUrl;
            document.getElementById('judulFilmHeader').textContent = '🎬 ' + tiket.judulFilm;
            
            // Deteksi kalau video tidak bisa di-embed
            setTimeout(() => {
                // Cek apakah video jalan atau error
                // Kalau error 153/150, tampilkan pesan
                console.log('📺 Video URL:', embedUrl);
            }, 2000);
        }

        // ============================================
        // SETUP INFO TIKET
        // ============================================

        function setupInfoTiket(tiket) {
            const namaLabel = tiket.nama === 'haris' ? 'Haris' : tiket.nama === 'anita' ? 'Anita' : 'Berdua';
            document.getElementById('infoTiket').textContent = namaLabel + ' (' + tiket.jumlah + ' org)';
            document.getElementById('infoKursi').textContent = tiket.kursi.join(', ');
            document.getElementById('infoSnack').textContent = tiket.snack.length > 0 ? tiket.snack.join(', ') : 'Tidak ada';
            document.getElementById('infoTanggal').textContent = tiket.tanggal;
        }

        // ============================================
        // GENERATE KURSI BIOSKOP
        // ============================================

        function generateKursi(tiket) {
            const grid = document.querySelector('.rbioskop-kursi-grid');
            if (!grid) return;

            let html = '';
            const baris = ['A', 'B', 'C', 'D', 'E'];

            // 5 baris x 10 kursi = 50 kursi
            baris.forEach(barisKursi => {
                for (let i = 1; i <= 10; i++) {
                    const kode = barisKursi + i;
                    const isMySeat = tiket.kursi.includes(kode);

                    html += '<div class="kursi-bioskop ' + (isMySeat ? 'kursi-saya' : '') + '" title="Kursi ' + kode + '">';
                    html += isMySeat ? '💛' : '💺';
                    html += '</div>';
                }
            });

            grid.innerHTML = html;
        }

        // ============================================
        // TIMER NONTON
        // ============================================

        let timerInterval = null;
        let waktuNonton = 0;

        function mulaiTimer(durasi) {
            // durasi dalam menit, 0 = sepuasnya
            if (durasi === 0) {
                document.getElementById('timerNonton').textContent = '⏱️ ∞ Sepuasnya';
                return;
            }

            waktuNonton = durasi * 60; // convert ke detik

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                waktuNonton--;

                if (waktuNonton <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerNonton').textContent = '⏱️ Selesai!';
                    alert('🎬 Waktu nonton sudah habis!\n\nTerima kasih sudah nonton di HarisAnita Cinema 💕');
                    return;
                }

                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const jam = Math.floor(waktuNonton / 3600);
            const menit = Math.floor((waktuNonton % 3600) / 60);
            const detik = waktuNonton % 60;

            const jamStr = String(jam).padStart(2, '0');
            const menitStr = String(menit).padStart(2, '0');
            const detikStr = String(detik).padStart(2, '0');

            document.getElementById('timerNonton').textContent = '⏱️ ' + jamStr + ':' + menitStr + ':' + detikStr;
        }

        // ============================================
        // CHAT MABAR
        // ============================================

        function toggleChat() {
            const chat = document.getElementById('chatMabar');
            chat.style.display = chat.style.display === 'none' ? 'flex' : 'none';
        }

        function kirimChat() {
            const input = document.getElementById('chatInput');
            const pesan = input.value.trim();
            if (!pesan) return;

            const messages = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.style.cssText = 'padding:8px 12px;background:rgba(212,175,55,0.2);border-radius:10px;margin-bottom:6px;color:#f5c542;font-size:13px;';
            msg.textContent = pesan;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
            input.value = '';
        }

        // Enter untuk kirim chat
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') kirimChat();
        });

        // ============================================
        // KELUAR BIOSKOP
        // ============================================

        function keluarBioskop() {
            if (confirm('🎬 Yakin mau keluar bioskop?\n\nTiket akan dihapus.')) {
                localStorage.removeItem('tiketBioskop');
                if (timerInterval) clearInterval(timerInterval);
                window.location.href = 'bioskop.html';
            }
        }

        // ============================================
        // ANIMASI HATI
        // ============================================

        function buatHati() {
            const container = document.getElementById('hatiContainer');
            if (!container) return;
            const hati = document.createElement('div');
            hati.className = 'hati-jatuh';
            const icons = ['❤️', '🎬', '🍿', '✨', '🎟️'];
            hati.textContent = icons[Math.floor(Math.random() * icons.length)];
            hati.style.left = Math.random() * 100 + '%';
            hati.style.fontSize = (Math.random() * 18 + 14) + 'px';
            hati.style.animationDuration = (Math.random() * 4 + 3) + 's';
            hati.style.opacity = Math.random() * 0.4 + 0.3;
            container.appendChild(hati);
            setTimeout(() => hati.remove(), 7000);
        }
        setInterval(buatHati, 1000);

        // ============================================
        // INISIALISASI
        // ============================================

        window.addEventListener('load', function() {
            const tiket = ambilTiket();
            if (!tiket) return;

            setupLayar(tiket);
            setupInfoTiket(tiket);
            generateKursi(tiket);
            mulaiTimer(tiket.durasi);

            // Tampilkan chat mabar kalau jumlah 2 orang
            if (tiket.jumlah === 2) {
                document.getElementById('chatMabar').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
